[workspace]
resolver = "2"
members = [
    "crates/watznue-core",
    "crates/watznue-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["gman"]
license = "GPL-3.0-or-later"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
watznue-core = { path = "crates/watznue-core" }
